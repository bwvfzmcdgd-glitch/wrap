*{box-sizing:border-box}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.slide{min-height:100svh;display:flex;align-items:center;justify-content:center;padding-block:clamp(48px,9vh,96px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-snap-align:start;background:var(--bg);color:var(--fg)}
.in{width:100%;max-width:880px;min-width:0;display:flex;flex-direction:column;gap:clamp(20px,4vh,36px)}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin:0}
h1,h2,.big{font-family:var(--display);font-stretch:70%;font-weight:900;line-height:.9;letter-spacing:-.01em;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:clamp(38px,11vw,176px);overflow-wrap:normal}
h2{font-size:clamp(36px,9vw,92px);overflow-wrap:anywhere}
.big{font-size:clamp(88px,26vw,260px);color:var(--acc);line-height:.82}
p{margin:0}
.lead{font-size:clamp(17px,2.4vw,22px);max-width:34rem;text-wrap:pretty}
.mut{opacity:.72}
.num{font-variant-numeric:tabular-nums}
.s-intro{--bg:var(--ink);--fg:var(--paper);--acc:var(--lime)}
.s-num{--bg:var(--lime);--fg:var(--ink);--acc:var(--ink)}
.s-who{--bg:var(--violet);--fg:var(--paper);--acc:var(--lime)}
.s-words{--bg:var(--pink);--fg:#1D0612;--acc:#1D0612}
.s-emoji{--bg:var(--orange);--fg:#21090A;--acc:#21090A}
.s-time{--bg:var(--ink);--fg:var(--paper);--acc:var(--sky)}
.s-days{--bg:var(--sky);--fg:#04141C;--acc:#04141C}
.s-awards{--bg:var(--deep);--fg:var(--paper);--acc:var(--lime)}
.s-fight{--bg:#FF4B2B;--fg:#1A0503;--acc:#1A0503}
.s-titles{--bg:#7CFFB2;--fg:#06180F;--acc:#06180F}

.s-vocab{--bg:var(--paper);--fg:#170F2B;--acc:#5B2BE0}
.s-mamme{--bg:#FFB6DC;--fg:#2A0618;--acc:#2A0618}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 28px}

.s-fight .rec b{font-size:clamp(40px,8vw,72px)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
